version: 2

models:
  - name: dim_vessel
    description: One row per vessel, deduplicated to its most recent self-reported identity snapshot.
    columns:
      - name: vessel_id
        description: GFW internal vessel id (the same id the Events API is queried with).
        tests:
          - unique
          - not_null

  - name: fact_fishing_event
    description: One row per fishing event, at the grain of the GFW event id.
    columns:
      - name: event_id
        tests:
          - unique
          - not_null
      - name: vessel_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_vessel')
                field: vessel_id
      - name: event_type
        tests:
          - accepted_values:
              arguments:
                values: ['fishing']
      - name: latitude
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: -90
                max_value: 90
      - name: longitude
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: -180
                max_value: 180
