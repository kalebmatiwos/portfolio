<svg width="680" height="696" viewBox="0 0 680 696" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Take Home Assignment pipeline architecture</title>
<desc>A vertical flow from the Global Fishing Watch API through Lambda extraction, S3 raw storage, validation with a quarantine branch, S3 curated storage modeled by dbt on Athena, and finally served to analytics and ML consumers.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#4b5563" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <style>
    .box { stroke-width: 1.25; rx: 8; }
    .gray  { fill: #f3f4f6; stroke: #9ca3af; }
    .blue  { fill: #dbeafe; stroke: #3b82f6; }
    .amber { fill: #fef3c7; stroke: #f59e0b; }
    .red   { fill: #fee2e2; stroke: #ef4444; }
    .teal  { fill: #ccfbf1; stroke: #14b8a6; }
    .purple{ fill: #ede9fe; stroke: #8b5cf6; }
    .title { font: 600 15px sans-serif; }
    .sub   { font: 12px sans-serif; }
    .t-gray  { fill: #374151; }
    .t-blue  { fill: #1e3a8a; }
    .t-amber { fill: #78350f; }
    .t-red   { fill: #7f1d1d; }
    .t-teal  { fill: #134e4a; }
    .t-purple{ fill: #4c1d95; }
    .arr { stroke: #4b5563; stroke-width: 1.5; }
  </style>
</defs>

<rect width="680" height="696" fill="#ffffff"/>

<line x1="337" y1="76"  x2="337" y2="136" class="arr" marker-end="url(#arrow)"/>
<line x1="337" y1="192" x2="337" y2="252" class="arr" marker-end="url(#arrow)"/>
<line x1="337" y1="308" x2="337" y2="368" class="arr" marker-end="url(#arrow)"/>
<line x1="337" y1="424" x2="337" y2="484" class="arr" marker-end="url(#arrow)"/>
<line x1="337" y1="540" x2="337" y2="600" class="arr" marker-end="url(#arrow)"/>
<line x1="470" y1="396" x2="500" y2="396" class="arr" marker-end="url(#arrow)"/>

<g>
  <rect x="205" y="20" width="265" height="56" class="box gray"/>
  <text x="337" y="38" text-anchor="middle" class="title t-gray">Global Fishing Watch API</text>
  <text x="337" y="56" text-anchor="middle" class="sub t-gray">Vessels API + Events API</text>
</g>

<g>
  <rect x="205" y="136" width="265" height="56" class="box blue"/>
  <text x="337" y="154" text-anchor="middle" class="title t-blue">Extract (Lambda)</text>
  <text x="337" y="172" text-anchor="middle" class="sub t-blue">Scheduled, paginated, retried</text>
</g>

<g>
  <rect x="205" y="252" width="265" height="56" class="box gray"/>
  <text x="337" y="270" text-anchor="middle" class="title t-gray">S3 raw zone</text>
  <text x="337" y="288" text-anchor="middle" class="sub t-gray">Raw JSON, partitioned by date</text>
</g>

<g>
  <rect x="205" y="368" width="265" height="56" class="box amber"/>
  <text x="337" y="386" text-anchor="middle" class="title t-amber">Validate and clean</text>
  <text x="337" y="404" text-anchor="middle" class="sub t-amber">Schema and quality checks</text>
</g>

<g>
  <rect x="500" y="368" width="140" height="56" class="box red"/>
  <text x="570" y="386" text-anchor="middle" class="title t-red">Quarantine</text>
  <text x="570" y="404" text-anchor="middle" class="sub t-red">Failed records</text>
</g>

<g>
  <rect x="205" y="484" width="265" height="56" class="box teal"/>
  <text x="337" y="502" text-anchor="middle" class="title t-teal">dbt models on Athena</text>
  <text x="337" y="520" text-anchor="middle" class="sub t-teal">dim_vessel, fact_fishing_event</text>
</g>

<g>
  <rect x="205" y="600" width="265" height="56" class="box purple"/>
  <text x="337" y="618" text-anchor="middle" class="title t-purple">Analytics and ML</text>
  <text x="337" y="636" text-anchor="middle" class="sub t-purple">Dashboards, downstream models</text>
</g>
</svg>
